<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ألبوم أُسرتي — يومٌ نصنعه معًا</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#FFF8EE; --paper:#FFFDF8; --ink:#2A2140; --ink2:#5D5478; --line:#F3DDB8;
  --turq:#16B3A6; --turq-d:#0D8A80; --turq-l:#D3F4F0;
  --apri:#FFB04A; --apri-d:#D98914; --apri-l:#FFEBCF;
  --coral:#FF6F61; --coral-d:#D94B3E; --coral-l:#FFE2DE;
  --sky:#38B6EE; --sky-d:#1588C0; --grape:#8A63FF; --grape-d:#6541D9; --green:#3CC56B;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
  --f-display:"Baloo Bhaijaan 2","Readex Pro",Tahoma,sans-serif;
  --f-body:"Readex Pro","Baloo Bhaijaan 2",Tahoma,"Noto Sans Arabic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:clamp(15px,1.02vw,21px);line-height:1.65;
  background-image:radial-gradient(circle,#FFE1B0 3px,transparent 4px),radial-gradient(circle,#CDEFEA 3px,transparent 4px);background-size:72px 72px;background-position:0 0,36px 36px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.3;text-wrap:balance}
p{margin:0;text-wrap:pretty}
body.paused *{animation-play-state:paused!important}

#app{max-width:1920px;margin:0 auto;padding:8px max(10px,env(safe-area-inset-left)) 14px max(10px,env(safe-area-inset-right));min-height:100dvh;display:flex;flex-direction:column;gap:10px}

/* ---------- top bar: album strip + controls ---------- */
.bar{display:flex;align-items:center;gap:12px;background:var(--turq);border-radius:22px;padding:7px 12px;box-shadow:0 5px 0 var(--turq-d)}
.brand{font-family:var(--f-display);font-weight:800;color:#fff;font-size:1.25rem;white-space:nowrap}
.brand small{display:block;font-size:.8rem;opacity:.9;line-height:1}
.strip{flex:1;display:flex;gap:8px;justify-content:center;min-width:0}
.strip.pulse .frame{animation:fpulse 1s ease-in-out 3}
@keyframes fpulse{50%{transform:translateY(-4px)}}
.frame{position:relative;width:min(8.2vw,128px);aspect-ratio:16/9;border-radius:10px;border:3px dashed rgba(255,255,255,.75);background:rgba(255,255,255,.18);padding:0;overflow:hidden;flex:none;transition:transform 160ms var(--ease-out)}
.frame:active{transform:scale(.96)}
.frame .n{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:1.2rem}
.frame.has{border:3px solid #fff;background:#fff}
.frame.has .n{inset:auto 3px 3px auto;width:1.4rem;height:1.4rem;border-radius:50%;background:var(--turq-d);font-size:.8rem}
.frame.ok{border-color:var(--c)}
.frame.ok::after{content:"✓";position:absolute;top:2px;left:3px;background:var(--c);color:#fff;border-radius:50%;width:1.2rem;height:1.2rem;display:grid;place-items:center;font-size:.75rem;font-weight:800}
.frame svg{width:100%;height:100%;display:block}
.frame.pop{animation:fpop 600ms var(--ease-out)}
@keyframes fpop{0%{transform:scale(.8)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.ctrls{display:flex;gap:8px}
.cb{width:44px;height:44px;border-radius:50%;border:0;background:#fff;display:grid;place-items:center;box-shadow:0 3px 0 rgba(0,0,0,.15);transition:transform 160ms var(--ease-out)}
.cb:active{transform:scale(.93)}
.cb svg{width:22px;height:22px}
@media (max-width:820px){.brand{display:none}.strip{gap:5px}.frame{width:10.2vw}.cb{width:36px;height:36px}.ctrls{gap:5px}.bar{gap:8px;padding:6px 8px}}

/* ---------- layout ---------- */
.main{display:grid;gap:12px;grid-template-columns:1fr;align-items:start}
@media (min-width:1100px) and (min-aspect-ratio:4/3){
  .main{grid-template-columns:minmax(0,min(calc((100dvh - 118px) * 1.7778),calc(100% - 470px))) minmax(400px,1fr)}
}

/* ---------- stage ---------- */
.stage{position:relative;width:100%;aspect-ratio:16/9;border-radius:24px;overflow:hidden;border:6px solid #fff;background:#CFEFFF;
  box-shadow:0 10px 0 rgba(42,33,64,.08),0 14px 30px rgba(42,33,64,.16);user-select:none;-webkit-user-select:none;touch-action:manipulation;isolation:isolate}
.layer{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.layer svg{position:absolute;inset:0;width:100%;height:100%;display:block}
#nearW{pointer-events:none}
#tint{position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(120,70,190,.30),rgba(255,140,70,.28));mix-blend-mode:multiply;opacity:0;transition:opacity 2s ease}
#tint.on{opacity:1}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.actor{transform-box:fill-box;transform-origin:50% 100%}
.idle{animation:breathe 3.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.016) translateY(-.5%)}}
.a-jump{animation:jump .62s var(--ease-out) 2}
@keyframes jump{35%{transform:translateY(-9%) scaleY(1.03)}70%{transform:translateY(0) scaleY(.97)}}
.a-nod{animation:nod .45s ease-in-out 3}
@keyframes nod{50%{transform:rotate(2.5deg) translateY(1%)}}
.a-squash{animation:squash .3s var(--ease-out)}
@keyframes squash{50%{transform:scaleX(.88) scaleY(1.04)}}
.eyes{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4.6s infinite}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.m-talk{opacity:0}
.speaking .m-talk{animation:mtalk .26s steps(1) infinite}
.speaking .m-rest{animation:mrest .26s steps(1) infinite}
@keyframes mtalk{0%{opacity:1}50%{opacity:0}}
@keyframes mrest{0%{opacity:0}50%{opacity:1}}
.glowp{transform-box:fill-box;transform-origin:50% 50%;animation:glowp 1.2s ease-in-out infinite}
@keyframes glowp{50%{transform:scale(1.15);opacity:.6}}

.hint{position:absolute;top:3%;left:50%;transform:translateX(-50%);background:#fff;border:4px solid var(--apri);border-radius:999px;padding:.35em 1.3em;font-family:var(--f-display);font-weight:800;font-size:clamp(1.05rem,1.9vw,1.9rem);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.08);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;animation:hin 300ms var(--ease-out)}
@keyframes hin{from{opacity:0;transform:translate(-50%,-10px)}}
.ring{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.22);box-shadow:0 0 0 5px rgba(255,111,97,.6);padding:0;touch-action:none;animation:ring 1.4s ease-in-out infinite}
.ring.grab{box-shadow:0 0 0 5px rgba(22,179,166,.75)}
.ring.sel{background:rgba(22,179,166,.35);animation:none;box-shadow:0 0 0 8px rgba(22,179,166,.9)}
.ring.target{border-style:dashed;box-shadow:none;background:rgba(255,255,255,.12);animation:none;opacity:.85}
.ring.target.armed{border-color:var(--apri);background:rgba(255,176,74,.3);animation:ring 1s ease-in-out infinite}
.ring.dragging{animation:none;background:transparent;border-color:transparent;box-shadow:none}
@keyframes ring{50%{transform:translate(-50%,-50%) scale(1.1)}}
.ring .lbl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hand{position:absolute;width:clamp(42px,5vw,78px);pointer-events:none!important;transform:translate(-25%,-5%);animation:tap 1.2s ease-in-out infinite;z-index:3}
@keyframes tap{50%{transform:translate(-25%,8%) scale(.9)}}
.dot{position:absolute;transform:translate(-50%,-50%);width:clamp(30px,3vw,46px);height:clamp(30px,3vw,46px);border-radius:50%;border:4px solid #fff;background:var(--apri);box-shadow:0 0 0 4px rgba(255,176,74,.4);padding:0;touch-action:none}
.dot.done{background:var(--turq);box-shadow:none}
.dot.next{animation:ring 1s ease-in-out infinite}
.fxl{position:absolute;inset:0;pointer-events:none!important;overflow:hidden}
.fx{position:absolute;font-size:clamp(18px,2.8vw,44px);animation:rise 1.5s var(--ease-out) forwards}
@keyframes rise{from{transform:translate(-50%,0) scale(.8);opacity:1}to{transform:translate(-50%,-170%) scale(1.3);opacity:0}}
.flash{position:absolute;inset:0;background:#fff;pointer-events:none!important;animation:flash 500ms ease-out forwards}
@keyframes flash{from{opacity:.95}to{opacity:0}}
.titlecard{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:var(--c,var(--turq));color:#fff;pointer-events:none!important;box-shadow:0 0 0 4px rgba(255,255,255,.6),12px 0 30px rgba(0,0,0,.18)}
.pgclone{transition:none;box-shadow:12px 0 30px rgba(0,0,0,.18)}
.titlecard::before{content:"";position:absolute;inset:3.5%;border:4px dashed rgba(255,255,255,.55);border-radius:22px}
.titlecard small{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(1rem,2vw,1.9rem)}
.titlecard h2{font-size:clamp(2rem,6vw,5.6rem);text-shadow:0 5px 0 rgba(0,0,0,.16)}
.trans{position:absolute;inset:0;pointer-events:none!important;transition:opacity 520ms ease}
.xbtn{align-self:center;display:inline-flex;align-items:center;gap:.45em;border:2px dashed var(--grape,#8A63FF);background:#F4EFFF;color:#5B3FC4;font-weight:800;border-radius:999px;padding:.35em 1.2em;font-size:1.05rem;transition:transform 160ms var(--ease-out)}.xbtn:active{transform:scale(.97)}.xbtn .hi{font-size:1.2rem}
.xq{font-size:clamp(1.5rem,2.6vw,2.2rem)!important;color:var(--ink)!important;margin:.4rem 0 .8rem;text-wrap:balance}
#ovbox .modes{margin-bottom:10px}#ovbox textarea{width:100%;margin-bottom:10px}
.xres{background:#F4EFFF;border-radius:12px;padding:.5em .9em}
.pg{flex:none;background:#fff;color:var(--turq-d);font-weight:800;border-radius:999px;padding:.25em .9em;font-size:.95rem;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.startbtn{position:absolute;bottom:3.5%;left:50%;transform:translateX(-50%)}
.startbtn{transition:opacity 160ms ease-out,transform 160ms ease-out}
.startbtn.gone{opacity:0;transform:translateX(-50%) scale(.96);pointer-events:none}

.subt{position:absolute;left:50%;bottom:3%;transform:translateX(-50%);background:rgba(42,33,64,.8);color:#fff;border-radius:14px;padding:.3em 1.1em;font-weight:700;font-size:clamp(1rem,1.6vw,1.6rem);max-width:90%;text-align:center;pointer-events:none!important}
.pausemark{position:absolute;inset:0;display:grid;place-items:center;background:rgba(42,33,64,.18);pointer-events:none!important}
.pausemark span{background:#fff;border-radius:999px;padding:.3em 1.2em;font-family:var(--f-display);font-weight:800;font-size:1.6rem}

/* album overlay & tray */
.albumov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(42,33,64,.35);animation:fadein 300ms ease}
@keyframes fadein{from{opacity:0}}
.spread{width:86%;aspect-ratio:2.05;background:#fff;border-radius:22px;border:8px solid #E8467C;display:grid;grid-template-columns:1fr 1fr;gap:4%;padding:3%;position:relative;box-shadow:0 14px 0 rgba(0,0,0,.12);animation:spin 420ms var(--ease-out)}
@keyframes spin{from{transform:scale(.94);opacity:0}}
.spread::after{content:"";position:absolute;top:4%;bottom:4%;left:50%;width:4px;background:#F9C6D6;transform:translateX(-50%)}
.page{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:6%}
.page .slot{border-radius:10px;border:3px dashed #F7A8C2;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:clamp(1rem,2vw,2rem);color:#E58AA8;overflow:hidden;background:#FFF5F8;padding:0}
.page .slot.has{border:4px solid var(--apri);background:#fff}
.page .slot svg{width:100%;height:100%;display:block}
.page .slot.big{grid-column:1/-1}
.covertxt{grid-column:1/-1;display:grid;place-items:center;text-align:center;color:#B8285A}
.covertxt h2{font-size:clamp(1.6rem,3.6vw,3.6rem)}
.tray{position:absolute;z-index:3;left:3%;right:3%;bottom:3%;display:flex;gap:2%;justify-content:center;padding:1.2% 1.5%;background:rgba(255,255,255,.92);border-radius:20px;border:4px solid var(--apri);animation:hin2 360ms var(--ease-out)}
@keyframes hin2{from{transform:translateY(20px);opacity:0}}
.card{width:17%;aspect-ratio:16/9;border-radius:10px;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.15);padding:0;overflow:hidden;background:#fff;touch-action:none;transition:transform 160ms var(--ease-out)}
.card svg{width:100%;height:100%;display:block;pointer-events:none}
.card.sel{border-color:var(--turq);transform:translateY(-8px)}
.card.drag{position:fixed;z-index:50;transition:none;transform:rotate(-4deg);pointer-events:none}
.pagetgt{position:absolute;transform:translate(-50%,-50%);border:5px dashed #fff;border-radius:14px;background:rgba(255,255,255,.2);padding:0}
.pagetgt.armed{border-color:var(--apri);background:rgba(255,176,74,.3);animation:ring 1s ease-in-out infinite}
.bigphoto{position:absolute;left:50%;top:44%;width:56%;aspect-ratio:16/9;transform:translate(-50%,-50%);border:8px solid #fff;border-radius:14px;box-shadow:0 18px 30px rgba(0,0,0,.25);overflow:hidden;animation:bigin 600ms var(--ease-out)}
@keyframes bigin{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
.bigphoto svg{width:100%;height:100%;display:block}
.fly{position:fixed;z-index:60;border:6px solid #fff;border-radius:12px;overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.25);transform-origin:0 0;pointer-events:none}
.fly svg{width:100%;height:100%;display:block}

/* ---------- panel ---------- */
.panel{container-type:inline-size;position:relative;background:var(--paper);border-radius:24px;border:3px solid var(--line);box-shadow:0 6px 0 var(--line);padding:16px;display:flex;flex-direction:column;gap:10px;min-height:150px}
.cap{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.who{width:4.2rem;height:4.2rem;border-radius:50%;overflow:hidden;background:#FFF1DA;border:4px solid var(--c,var(--apri));flex:none}
.who svg{width:100%;height:100%;display:block}
.chip{display:inline-block;background:var(--c,var(--grape));color:#fff;font-weight:700;font-size:.9rem;border-radius:999px;padding:.05em .9em}
.line{font-size:clamp(1.25rem,1.55vw,1.8rem);font-weight:700;margin-top:4px;min-height:1.6em}
.line.q{font-family:var(--f-display);font-size:clamp(1.5rem,1.9vw,2.2rem);font-weight:800}
.phint{background:var(--apri-l);border-radius:14px;padding:.45em .9em;font-weight:700;color:#7A4A00}
.btn{border:0;border-radius:999px;padding:.55em 1.5em;font-family:var(--f-display);font-weight:800;font-size:1.2rem;display:inline-flex;align-items:center;justify-content:center;gap:.45em;
  background:var(--apri);color:#4A2D00;box-shadow:0 5px 0 var(--apri-d);transition:transform 160ms var(--ease-out),box-shadow 160ms var(--ease-out)}
.btn:active{transform:translateY(3px) scale(.98);box-shadow:0 2px 0 var(--apri-d)}
.btn.turq{background:var(--turq);color:#fff;box-shadow:0 5px 0 var(--turq-d)}
.btn.coral{background:var(--coral);color:#fff;box-shadow:0 5px 0 var(--coral-d)}
.btn.grape{background:var(--grape);color:#fff;box-shadow:0 5px 0 var(--grape-d)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 #E8DCC4;border:2px solid #E8DCC4}
.btn.big{font-size:1.8rem;padding:.5em 2em}
.btn.sm{font-size:1rem;padding:.4em 1em}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.enter{animation:enter 260ms var(--ease-out)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
.coverp h1{font-size:clamp(2rem,2.8vw,3rem);color:var(--coral-d)}
.coverp p{color:var(--ink2);font-weight:600}
.teachnote{font-size:.9rem;color:var(--ink2);background:#F4F0FF;border-radius:12px;padding:.5em .8em}

.credits{background:#FFF6E6;border:2px dashed var(--apri);border-radius:16px;padding:.6em .9em;font-size:.98rem;color:var(--ink)}
.credits b{font-family:var(--f-display);color:var(--coral-d);font-size:1.05rem}
.credits ul{list-style:none;margin:.2em 0;padding:0;display:grid;gap:1px}
.credits .id{font-variant-numeric:tabular-nums;color:var(--ink2);direction:ltr;unicode-bidi:isolate}
.credits p{font-weight:700;color:var(--turq-d)}
.credits .sep{margin:0 .5em;color:var(--ink2)}
/* creator */
.ctitle{font-family:var(--f-display);font-weight:800;font-size:clamp(1.4rem,1.8vw,2rem);color:var(--turq-d)}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tab{border:0;border-radius:14px;background:#F2ECE0;padding:.4em .2em;font-weight:700;font-size:.95rem;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform 160ms var(--ease-out)}
.tab .ti{font-size:1.5rem;line-height:1}
.tab[aria-selected="true"]{background:var(--turq);color:#fff}
.tab:active{transform:scale(.96)}
.opt h3{font-size:1.1rem;margin:2px 0 6px;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ch{border:3px solid #EADFCB;background:#fff;border-radius:999px;padding:.3em 1em;font-weight:700;font-size:1.1rem;transition:transform 160ms var(--ease-out)}
.ch:active{transform:scale(.96)}
.ch[aria-pressed="true"]{background:var(--turq);border-color:var(--turq);color:#fff}
.sw{width:2.7rem;height:2.7rem;border-radius:50%;border:4px solid #fff;box-shadow:0 0 0 2px #E5D8C0;padding:0;transition:transform 160ms var(--ease-out)}
.sw:active{transform:scale(.92)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 5px var(--turq)}
.namein{width:100%;font:inherit;font-size:1.35rem;font-weight:700;padding:.45em .9em;border-radius:16px;border:3px solid #CDEFEA;background:#fff;color:var(--ink)}

/* ask */
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:0;border-radius:20px;min-height:4.4rem;font-family:var(--f-display);font-weight:800;font-size:1.45rem;display:flex;align-items:center;justify-content:center;gap:.4em;transition:transform 160ms var(--ease-out),box-shadow 160ms var(--ease-out)}
.mode .mi{display:inline-grid;place-items:center;width:2.6rem;height:2.6rem;border-radius:14px;background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.06)}.mode .mi svg{width:1.9rem;height:1.9rem}
.mode.w{background:var(--turq-l);color:var(--turq-d);box-shadow:0 6px 0 #9FE2DA}
.mode.o{background:var(--apri-l);color:#9A5A00;box-shadow:0 6px 0 #FFD29A}
.mode:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 rgba(0,0,0,.1)}
.mode.on{outline:5px solid currentColor;outline-offset:-5px}
textarea{width:100%;min-height:7rem;resize:vertical;font-family:var(--f-body);font-size:1.55rem;font-weight:700;line-height:1.75;color:var(--ink);border:3px solid #9FE2DA;border-radius:18px;padding:.6rem .9rem;background:#fff;
  background-image:repeating-linear-gradient(transparent 0 2.7rem,#F1E9D8 2.7rem 2.75rem);background-attachment:local}
textarea::placeholder{color:#A9A2BD}
.oral{background:var(--apri-l);border:3px dashed var(--apri);border-radius:18px;padding:.9rem;text-align:center}
.oral p{font-family:var(--f-display);font-size:1.6rem;font-weight:800;color:#8A4D00}
.helpbtn{align-self:center;border:2px solid var(--coral);background:#fff;color:var(--coral-d);font-weight:700;border-radius:999px;padding:.3em 1.2em;font-size:1.05rem;transition:transform 160ms var(--ease-out)}
.helpbtn:active{transform:scale(.97)}.helpbtn{display:inline-flex;align-items:center;gap:.45em}.helpbtn .hi{display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:#FFF4CC}.helpbtn .hi svg{width:1.45rem;height:1.45rem}.hopt{display:flex;align-items:center;gap:.6em}.hopt .hn{flex:none;display:inline-grid;place-items:center;width:1.9rem;height:1.9rem;border-radius:50%;background:#FFE3DF;color:var(--coral-d);font-size:1.05rem;font-variant-numeric:tabular-nums}.hopt.picked .hn{background:var(--coral);color:#fff}
.help{background:var(--coral-l);border-radius:18px;padding:12px}
.help h3{font-size:1.3rem;text-align:center;color:#A3322A;margin-bottom:8px}
.hopts{display:grid;gap:8px}
.hopt{text-align:start;border:3px solid #F7C4BD;background:#fff;border-radius:16px;padding:.5em .9em;font-weight:700;font-size:1.3rem;transition:transform 160ms var(--ease-out)}
.hopt:active{transform:scale(.98)}
.hopt.picked{border-color:var(--ink2);border-style:dashed}
.nowmsg{text-align:center;font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:var(--sky-d);margin-top:8px}
.retry{background:#FFF0C9;border:3px solid #FFD36B;border-radius:16px;padding:.55em .9em;font-weight:800;font-size:1.25rem;color:#7A4D00}
.answer{background:#F0FBFA;border:3px solid #BDEBE5;border-radius:16px;padding:.55em .9em}
.answer small{color:var(--ink2);font-weight:700}
.answer p{font-size:1.55rem;font-weight:800;white-space:pre-wrap;word-break:break-word}
.teacher{border:3px dashed #A894F0;background:#F4F0FF;border-radius:18px;padding:12px}
.teacher h3{font-size:1.35rem;color:#4C33B5}
.teacher p{font-size:.95rem;color:var(--ink2);margin:2px 0 10px}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tb .btn{font-size:1.45rem}
.good{text-align:center;background:#E3FAEE;border:3px solid #9BE6C1;border-radius:18px;padding:12px;font-family:var(--f-display);font-size:1.8rem;font-weight:800;color:#1E9E57}
.linkbtn{background:none;border:0;color:var(--ink2);text-decoration:underline;font-size:.95rem;padding:.2em}
@container (max-width:470px){.mode{font-size:1.2rem;min-height:3.9rem}.tabs{grid-template-columns:repeat(5,1fr)}.tab{font-size:.8rem}}

/* overlays */
.ov{position:fixed;inset:0;z-index:70;background:rgba(42,33,64,.45);display:grid;place-items:center;padding:16px}
.ovbox{width:min(980px,100%);max-height:94dvh;overflow:auto;background:#FFFBF2;border:5px solid var(--apri);border-radius:28px;padding:22px 26px;animation:ovin 220ms var(--ease-out)}
@keyframes ovin{from{opacity:0;transform:scale(.96)}}
.ovbox h2{font-size:2rem;color:var(--coral-d)}
.tag{display:inline-block;background:#EFE6D2;border-radius:999px;padding:.05em .9em;font-weight:700;color:var(--ink2);font-size:.95rem}
.score{font-size:1.5rem;font-weight:800;margin:.4rem 0}
.score b{font-size:2.6rem;color:var(--turq-d);font-variant-numeric:tabular-nums}
.goal{border-radius:14px;padding:.5em .9em;font-weight:800}
.goal.y{background:#E3FAEE;color:#1E9E57}.goal.n{background:#FFF0C9;color:#7A4D00}
.rlist{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px}
.rlist li{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid #F0E4CA;border-radius:12px;padding:.3em .8em;font-weight:700}
.st{border-radius:999px;padding:0 .8em;font-size:.95rem}
.st.ok{background:#E3FAEE;color:#1E9E57}.st.no{background:#FFE1E1;color:#B73737}.st.na{background:#EEE;color:#777}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.viewer{width:min(1100px,100%);background:#fff;border-radius:22px;border:6px solid #fff;overflow:hidden;position:relative;animation:ovin 240ms var(--ease-out)}
.viewer .ph{aspect-ratio:16/9;overflow:hidden}
.viewer .ph svg{width:100%;height:100%;display:block;animation:kb 6s ease-in-out forwards}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.1)}}
.viewer .vbar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--paper)}
@media (max-width:760px){.cap{grid-template-columns:1fr}.who{width:3.2rem;height:3.2rem}}

/* =====================================================================
   RESPONSIVE — desktop caps, iPad (landscape / portrait), phones
   ===================================================================== */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
img,svg{max-width:100%}
.ovbox,.viewer{max-width:100%}
.hint,.subt{max-width:min(94%,900px)}

/* very wide screens: keep the book centred and readable */
@media (min-width:1921px){
  #app{max-width:1920px}
  body{font-size:21px}
}

/* small laptops / iPad Pro landscape (1024–1366) */
@media (max-width:1366px) and (min-width:1025px){
  .main{gap:10px}
  .panel{padding:14px}
}

/* iPad landscape (≈1024–1194 wide): keep stage + panel side by side */
@media (min-width:900px) and (max-width:1099px) and (orientation:landscape){
  .main{grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr)}
  .panel{max-height:calc(100dvh - 90px);overflow:auto}
  .line{font-size:1.2rem}
  .line.q{font-size:1.4rem}
  .btn.big{font-size:1.5rem;padding:.45em 1.6em}
}

/* iPad portrait & small tablets (≤1024): stacked, larger touch targets */
@media (max-width:1024px){
  body{font-size:16px}
  .cb{width:44px;height:44px}
  .tab{padding:.5em .2em}
  .ch{padding:.4em 1.1em}
  .ovbox{padding:18px 20px;border-radius:24px}
  .ovbox h2{font-size:1.7rem}
  .viewer{width:100%}
}
@media (max-width:1024px) and (orientation:portrait){
  .main{grid-template-columns:1fr}
  .panel{min-height:auto}
}

/* large phones / small tablets (≤820) */
@media (max-width:820px){
  .strip .frame{flex:1 1 0;width:auto;min-width:0;max-width:96px}
  #app{gap:8px}
  .stage{border-width:4px;border-radius:18px}
  .panel{border-radius:20px;padding:14px}
  .mgrid{grid-template-columns:repeat(2,1fr)}
  .spread{width:94%;border-width:6px}
  .tray{left:2%;right:2%;bottom:2%;border-width:3px;border-radius:14px}
  .card{border-width:3px}
}

/* phones (≤600) */
@media (max-width:600px){
  body{font-size:15px;background-size:56px 56px;background-position:0 0,28px 28px}
  #app{padding:6px max(8px,env(safe-area-inset-left)) max(10px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-right));gap:8px}
  /* top bar wraps: page tag + controls on row 1, album strip on row 2 */
  .bar{flex-wrap:wrap;border-radius:18px;padding:6px 8px;gap:6px;box-shadow:0 4px 0 var(--turq-d)}
  .pg{order:1;font-size:.85rem}
  .ctrls{order:2;margin-inline-start:auto;gap:6px}
  .strip{order:3;flex:1 0 100%;gap:4px}
  .frame{flex:1 1 0;width:auto;max-width:none;border-width:2px;border-radius:7px}
  .frame.has{border-width:2px}
  .frame .n{font-size:.95rem}
  .frame.has .n{width:1.1rem;height:1.1rem;font-size:.65rem}
  .frame.ok::after{width:1rem;height:1rem;font-size:.6rem}
  .cb{width:40px;height:40px}
  .cb svg{width:20px;height:20px}

  .stage{border-width:3px;border-radius:14px;box-shadow:0 6px 0 rgba(42,33,64,.08),0 8px 18px rgba(42,33,64,.14)}
  .hint{font-size:.9rem;border-width:3px;padding:.25em .9em;top:2.5%}
  .subt{font-size:.85rem;border-radius:10px;padding:.25em .8em}
  .titlecard::before{border-width:3px;border-radius:14px}
  .pausemark span{font-size:1.1rem}
  .bigphoto{width:72%;border-width:5px}
  .spread{width:96%;border-width:4px;border-radius:14px}
  .page .slot{border-width:2px;border-radius:6px}
  .card{width:18%;border-width:2px;border-radius:6px}
  .tray{padding:1.5%;border-radius:10px}

  .panel{padding:12px;border-radius:18px;gap:8px;box-shadow:0 4px 0 var(--line)}
  .cap{gap:8px}
  .line{font-size:1.15rem}
  .line.q{font-size:1.3rem}
  .chip{font-size:.8rem}
  .btn{font-size:1.05rem;padding:.55em 1.2em}
  .btn.big{font-size:1.35rem;padding:.5em 1.4em;width:100%}
  .stage .btn.big,.stage .startbtn{width:auto;font-size:1rem;padding:.35em 1.1em;box-shadow:0 3px 0 rgba(0,0,0,.18)}
  .btn.sm{font-size:.9rem}
  .row{gap:8px}
  .row.sb>.btn{flex:1 1 auto}
  .coverp h1{font-size:1.7rem}
  .ctitle{font-size:1.3rem}

  .tabs{gap:4px}
  .tab{font-size:.72rem;border-radius:10px;padding:.45em .1em}
  .tab .ti{font-size:1.25rem}
  .ch{font-size:.95rem;border-width:2px}
  .sw{width:2.4rem;height:2.4rem}
  .namein{font-size:1.1rem}

  .modes{gap:8px}
  .mode{font-size:1.1rem;min-height:3.6rem;border-radius:16px}
  .mode .mi{width:2.1rem;height:2.1rem}.mode .mi svg{width:1.5rem;height:1.5rem}
  textarea{font-size:1.2rem;min-height:6rem;background-image:repeating-linear-gradient(transparent 0 2.1rem,#F1E9D8 2.1rem 2.15rem)}
  .oral p{font-size:1.25rem}
  .hopt{font-size:1.05rem}
  .help h3,.teacher h3{font-size:1.15rem}
  .answer p{font-size:1.2rem}
  .tb{grid-template-columns:1fr}
  .tb .btn{font-size:1.2rem}
  .good{font-size:1.4rem}
  .retry{font-size:1.05rem}
  .nowmsg{font-size:1.15rem}

  .ov{padding:8px;align-items:end}
  .ovbox{padding:16px;border-width:4px;border-radius:20px;max-height:92dvh}
  .ovbox h2{font-size:1.45rem}
  .score{font-size:1.2rem}.score b{font-size:2rem}
  .mgrid{grid-template-columns:1fr}
  .rlist li{flex-wrap:wrap;gap:4px}
  .xq{font-size:1.3rem!important}
  .viewer{border-width:3px;border-radius:14px}
  .viewer .vbar{flex-wrap:wrap;gap:8px;padding:8px 10px}
}

/* small phones (≤380, e.g. iPhone SE / mini) */
@media (max-width:380px){
  body{font-size:14px}
  .cb{width:36px;height:36px}
  .ctrls{gap:4px}
  .tab{font-size:.65rem}
  .tab .ti{font-size:1.1rem}
  .mode{font-size:1rem;min-height:3.2rem}
  .modes{grid-template-columns:1fr}
  .hint{font-size:.8rem}
}

/* phones in landscape: fit the stage to the short viewport height */
@media (max-height:520px) and (orientation:landscape){
  #app{padding-top:4px;gap:6px}
  .bar{padding:4px 8px;border-radius:14px;flex-wrap:nowrap}
  .brand{display:none}
  .frame{width:min(7vw,70px)}
  .cb{width:34px;height:34px}
  .main{grid-template-columns:minmax(0,calc((100dvh - 70px) * 1.7778)) minmax(240px,1fr);gap:8px}
  .panel{max-height:calc(100dvh - 64px);overflow:auto;padding:10px;min-height:0}
  .line{font-size:1rem}.line.q{font-size:1.15rem}
  .btn.big{font-size:1.2rem;width:auto}
  .hint{font-size:.85rem}
  .ov{align-items:center}
  .ovbox{max-height:96dvh}
}

/* touch devices: no sticky hover states, bigger hit areas */
@media (hover:none) and (pointer:coarse){
  .linkbtn{padding:.5em .4em}
  .dot{min-width:36px;min-height:36px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.m-talk{opacity:0}}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand">ألبوم أُسرتي<small>يومٌ نصنعه معًا</small></div><span class="pg" id="pg" aria-live="polite">الغلاف</span>
    <div class="strip" id="strip" aria-label="إطارات الألبوم الستة"></div>
    <div class="ctrls">
      <button class="cb" id="bPause" aria-label="إيقاف مؤقّت" title="إيقاف مؤقّت"></button>
      <button class="cb" id="bReplay" aria-label="إعادة اللقطة" title="إعادة اللقطة"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z" fill="#16B3A6"/></svg></button>
      <button class="cb" id="bMute" aria-label="كتم الصوت" aria-pressed="false" title="كتم الصوت"></button>
      <button class="cb" id="bTeach" aria-label="قائمة المعلّم" title="قائمة المعلّم"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4" fill="#8A63FF"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="#8A63FF"/><rect x="15" y="2" width="7" height="5" rx="1" fill="#FFB04A"/></svg></button>
    </div>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <div class="layer" id="farW"><svg id="far" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg></div>
      <div class="layer" id="midW"><svg id="mid" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="مشهد القصة"></svg></div>
      <div class="layer" id="nearW"><svg id="near" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg></div>
      <div id="tint"></div>
      <div id="ui"></div>
    </div>
    <section class="panel" id="panel" aria-live="polite"></section>
  </div>
</div>
<div class="ov" id="ov" hidden><div id="ovbox" role="dialog" aria-modal="true"></div></div>
<script src="engine.js?v=3"></script>
<script src="story.js?v=3"></script>
</body>
</html>
